<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quiz - Single Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }  

    h3{
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    #quiz-container, #result-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .question-block {
      text-align: left;
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background: #f9f9f9;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .question-block h3 {
      margin-bottom: 10px;
    }

    .options label {
      display: block;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .options label:hover {
      background-color: #e8f4f8;
    }

    .options input[type="radio"] {
      margin-right: 10px;
    }

    #submit-btn {
      margin-top: 25px;
      padding: 12px 25px;
      background-color: #27ae60;
      border: none;
      color: white;
      font-size: 1em;
      border-radius: 6px;
      cursor: pointer;
    }

    #submit-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #goToDebugBtn {
      background-color: #f39c12;
      margin-top: 20px;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }

    #timer {
      font-size: 1.5em;
      font-weight: bold;
      color: #d35400;
    }

    #feedback-message {
      font-size: 1.2em;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <div id="question-header">
      <h3>All Questions</h3>
      <div id="timer">15:00</div>
    </div>
    <hr>
    <div id="questions-wrapper">Loading questions...</div>
    <button id="submit-btn" style="display:none;">Submit Quiz</button>
  </div>

  <div id="result-container" style="display:none;">
    <h2>Quiz Submitted!</h2>
    <p id="feedback-message">Thank you for completing the quiz. Your results have been recorded.</p>
    <button id="goToDebugBtn" style="display: none;">Go to Debugging Round</button>
  </div>

  <script>
  // Redirect to /login on reload
  if (performance.navigation.type === 1) {
    window.location.href = "/login";
  }

  const quizContainer = document.getElementById('quiz-container');
  const resultContainer = document.getElementById('result-container');
  const feedbackMessage = document.getElementById('feedback-message');
  const timerElement = document.getElementById('timer');
  const questionsWrapper = document.getElementById('questions-wrapper');
  const submitBtn = document.getElementById('submit-btn');
  const goToDebugBtn = document.getElementById('goToDebugBtn');

  let quizQuestions = [];
  let userAnswers = [];
  let timer;
  let quizTimeout;

  async function startQuiz() {
    const username = localStorage.getItem('username');
    if (!username) {
      questionsWrapper.innerHTML = '<h2>Error</h2><p>You must be logged in to start the quiz.</p>';
      return;
    }

    try {
      const response = await fetch('/api/questions');
      let allQuestions = await response.json();

      if (!allQuestions.length) {
        questionsWrapper.textContent = "No questions available.";
        return;
      }

      // ✅ Shuffle questions and pick only 15 randomly
      quizQuestions = shuffleArray(allQuestions).slice(0, 15);

      userAnswers = new Array(quizQuestions.length).fill(null);
      renderAllQuestions();
      startTimer();
    } catch (error) {
      console.error(error);
      questionsWrapper.textContent = "Failed to load quiz.";
    }
  }

  // ✅ Fisher-Yates shuffle
  function shuffleArray(arr) {
    let array = [...arr];
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function renderAllQuestions() {
    questionsWrapper.innerHTML = '';
    quizQuestions.forEach((q, index) => {
      const div = document.createElement('div');
      div.className = 'question-block';
      const optionsHtml = q.options.map((opt, i) => `
        <li>
          <label>
            <input type="radio" name="q${index}" value="${i}">
            ${opt}
          </label>
        </li>
      `).join('');
      div.innerHTML = `
        <h3 style="white-space: pre-wrap">Q${index + 1}. ${q.question}</h3>
        <ol type="A" class="options">${optionsHtml}</ol>
      `;
      questionsWrapper.appendChild(div);
    });
    submitBtn.style.display = 'inline-block';
  }

  questionsWrapper.addEventListener('change', (e) => {
    if (e.target.name && e.target.value !== undefined) {
      const index = parseInt(e.target.name.replace('q', ''), 10);
      userAnswers[index] = parseInt(e.target.value, 10);
    }
  });

  function startTimer() {
    let duration = 15 * 60; // 15 minutes
    quizTimeout = setTimeout(submitQuiz, duration * 1000);
    timer = setInterval(() => {
      duration--;
      const minutes = Math.floor(duration / 60);
      const seconds = duration % 60;
      timerElement.textContent =
        `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      if (duration <= 0) clearInterval(timer);
    }, 1000);
  }

  async function submitQuiz() {
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    clearTimeout(quizTimeout);
    clearInterval(timer);

    let score = 0;
    for (let i = 0; i < quizQuestions.length; i++) {
      if (userAnswers[i] === quizQuestions[i].correctOptionIndex) {
        score++;
      }
    }

    try {
      const username = localStorage.getItem('username');
      await fetch('/score/scoreUpdate', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, score })
      });
    } catch (error) {
      console.error('Error updating score:', error);
    }

    quizContainer.style.display = 'none';
    resultContainer.style.display = 'block';
    goToDebugBtn.style.display = 'none';
  }

  submitBtn.addEventListener('click', submitQuiz);

  goToDebugBtn.addEventListener('click', () => {
    window.location.href = '/debug';
  });

  startQuiz();
</script>

</body>
</html>
